    id: record
    attributes:
      label: "Record id / Identificador del registro"
      description: "The `id` column of the row. / La columna `id` de la fila."
    validations:
      required: true
  - type: input
    id: published
    attributes:
      label: "What the file says / Lo que dice el archivo"
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: "What it should say / Lo que debería decir"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Source page or table that shows it / Página o tabla de la fuente que lo muestra"
      description: "An official source if there is one. / Una fuente oficial, si existe."
    validations:
      required: true
