name: "Report a wrong value / Reportar un valor incorrecto"
description: "A value in a published dataset that does not match its source. / Un valor publicado que no coincide con su fuente."
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        We check every report against the official source. If the data is wrong, we fix it, publish a new patch version and add a row to the [corrections log](https://probativegrowth.com/data/corrections/). Please leave out personal details and anything about a client or a case.

        Revisamos cada reporte con la fuente oficial. Si el dato está mal, lo corregimos, publicamos una nueva versión y agregamos una fila al [registro de correcciones](https://probativegrowth.com/es/datos/correcciones/). No incluya datos personales ni información de clientes o casos.
